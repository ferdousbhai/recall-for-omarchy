[package]
name = "recall"
version = "0.4.3"
edition = "2021"
description = "Search your files by what's in them: the engine (indexing, the embedding model, search)."
license = "MIT"
repository = "https://github.com/ferdousbhai/recall-for-omarchy"
rust-version = "1.89"

[lib]
name = "recall"
path = "src/lib.rs"

[[bin]]
name = "recall-engine"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
half = "2"
libc = "0.2"
quick-xml = { version = "0.41", default-features = false }
regex = "1"
rusqlite = { version = "0.35", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicode-general-category = "1"
unicode-normalization = "0.1"
unicode-segmentation = "1"
uuid = { version = "1", features = ["v4"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"

[[bin]]
name = "recall"
path = "src/agent_main.rs"
