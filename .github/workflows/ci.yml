name: CI
on:
  # Every push to any branch, so a change is checked before it is proposed, and pull requests, which is how changes
  # from forks arrive.
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, "1.89"] # 1.89 is the MSRV in Cargo.toml (uuid in Cargo.lock needs it)
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy
      # poppler-utils and tesseract are what tests/folders_and_tools.rs and tests/ocr.rs read PDFs and pictures with.
      # With CI set (GitHub sets it), those tests fail rather than skip when a tool is missing. The 865 MB embedding
      # model is not downloaded here, so tests/reference_vectors.rs reports itself skipped; it runs where the model is.
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng clang cmake ninja-build ffmpeg poppler-utils libvips-tools
      - run: command -v pdftotext pdftoppm tesseract
      - uses: actions/cache@v4
        with:
          path: Vendor/llama
          key: llama-${{ runner.os }}-${{ hashFiles('scripts/build-llama.sh', 'scripts/llama.cpp-no-logits.patch') }}
      - run: test -f Vendor/llama/lib/libllama.so || scripts/build-llama.sh
      - run: cargo build --locked --all-targets
      - run: cargo test --locked
      - if: matrix.toolchain == '1.89' # newer stable clippy adds lints; pin to keep CI reproducible
        run: cargo clippy --locked --all-targets -- -D warnings
  installer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          bash -n install.sh packaging/PKGBUILD packaging/recall-for-omarchy.install scripts/build-llama.sh omarchy/bundle.sh \
            bin/arch-run bin/build-packages bin/check bin/check-plugin bin/collect-packages bin/release \
            bin/validate-models bin/verify-release tests/plugin/fake-client
          tests/install_test.sh
  plugin:
    runs-on: ubuntu-24.04
    # The panel is QML for the Omarchy shell, which runs on Arch's Qt 6 and Quickshell, so it is checked on Arch.
    container: archlinux:latest
    defaults:
      run:
        shell: bash
    steps:
      # A font, because the container has none and the panel's layout is measured in text.
      - run: pacman -Syu --noconfirm --needed git jq qt6-declarative quickshell ttf-dejavu
      - uses: actions/checkout@v4
      # The shell's QML modules (qs.Commons, qs.Ui) and its plugin validator come from Omarchy itself.
      - run: git clone --depth 1 https://github.com/omacom/omarchy "$RUNNER_TEMP/omarchy"
      # Manifest validation, qmllint, and the panel loaded and driven offscreen against a stand-in for the daemon.
      - run: OMARCHY_PATH="$RUNNER_TEMP/omarchy" bin/check-plugin
