name: Verify published release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published tag to verify
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install from the published repository in a fresh Arch root
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        run: |
          [[ $RELEASE_TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git checkout "$RELEASE_TAG" -- install.sh packaging/PKGBUILD Cargo.toml omarchy/skills/recall/SKILL.md
          sudo apt-get update
          sudo apt-get install -y arch-install-scripts zstd
          bin/verify-release "$RELEASE_TAG"
