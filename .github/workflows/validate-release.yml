name: Validate released model runtime
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to validate (v0.6.0 or later; earlier releases shipped tarballs)
        required: true
permissions:
  contents: read
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install the release, download the models, and run the smoke test on CPU and Vulkan
        env:
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          [[ $RELEASE_TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git checkout "$RELEASE_TAG" -- install.sh packaging/PKGBUILD Cargo.toml omarchy/smoke.py tests/reference
          sudo apt-get update
          sudo apt-get install -y arch-install-scripts zstd
          bin/validate-models "$RELEASE_TAG"
